name: Android Release v2.0

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x gradlew || true

      - name: Build APK (Release / Debug)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Prepare APK Artifact
        id: prepare_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" IncomeManage-v2.0.apk
          echo "apk_path=IncomeManage-v2.0.apk" >> $GITHUB_ENV

      - name: Create or Update GitHub Release v2.0
        uses: softprops/action-gh-release@v2
        with:
          name: "Income Manage v2.0"
          tag_name: "v2.0"
          draft: false
          prerelease: false
          body: |
            ## 🚀 Income Manage v2.0

            ### Novedades en esta versión:
            - **Sincronización en tiempo real con Cloud Firestore**: Accede a todos los registros actuales de Tesorería y Gastos Personales sincronizados con la versión Web.
            - **Google Sign-In & One-Tap Integration**: Autenticación directa con cuenta de Google con soporte oficial de Firebase.
            - **Soporte de Espacios Privados y Compartidos**: Cifrado y sincronización de espacios mediante Passphrase.
            - **Diseño refinado**: Tarjetas de balance mensual, progreso de presupuesto en tiempo real y logs de auditoría.
          files: |
            IncomeManage-v2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
